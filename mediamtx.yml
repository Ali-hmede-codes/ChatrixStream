################################################
# MediaMTX Configuration for ChatrixStream
# Compatible with MediaMTX v1.12.0
################################################

################################################
# Global settings -> General
################################################
logLevel: info
logDestinations: [stdout]
readTimeout: 60s
writeTimeout: 60s
writeQueueSize: 512

################################################
# Global settings -> Authentication
################################################
authMethod: internal
authInternalUsers:
  - user: any
    pass:
    ips: []
    permissions:
      - action: publish
        path:
      - action: read
        path:
      - action: playback
        path:
  - user: any
    pass:
    ips: ["127.0.0.1", "::1"]
    permissions:
      - action: api
      - action: metrics
      - action: pprof

################################################
# Global settings -> Control API
################################################
api: yes
apiAddress: :9997
apiAllowOrigin: '*'

################################################
# Global settings -> Metrics
################################################
metrics: no
metricsAddress: :9998

################################################
# Global settings -> RTSP server
################################################
rtsp: yes
rtspAddress: :8554
rtspTransports: [tcp]

################################################
# Global settings -> RTMP server
################################################
rtmp: no

################################################
# Global settings -> HLS server
################################################
hls: yes
hlsAddress: :8888
hlsAllowOrigin: '*'
hlsAlwaysRemux: yes
hlsVariant: mpegts
hlsSegmentCount: 7
hlsSegmentDuration: 2s
hlsSegmentMaxSize: 50M
hlsMuxerCloseAfter: 120s

################################################
# Global settings -> WebRTC server
################################################
webrtc: no

################################################
# Global settings -> SRT server
################################################
srt: no

################################################
# Default path settings
################################################
pathDefaults:
  sourceOnDemandStartTimeout: 60s
  sourceOnDemandCloseAfter: 120s
  maxReaders: 0

################################################
# Path settings
################################################
paths:
  all_others:
