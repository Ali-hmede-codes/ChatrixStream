<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatrixStream | Premium Streaming</title>
    <meta name="description" content="Watch high quality streams instantly with ChatrixStream">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>
    <div class="bg-effects">
        <div class="glow-blob blob-1"></div>
        <div class="glow-blob blob-2"></div>
        <div class="glow-blob blob-3"></div>
    </div>

    <div id="app">
        <div id="loading" class="hidden">
            <div class="spinner-container">
                <div class="spinner"></div>
            </div>
            <p id="loading-text">Authenticating session...</p>
        </div>

        <div id="code-form">
            <div class="glass-card container">
                <div class="brand">
                    <div class="brand-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <polygon points="5 3 19 12 5 21 5 3"></polygon>
                        </svg>
                    </div>
                    <h1>ChatrixStream</h1>
                </div>
                <p class="subtitle">Enter your private access code to tune into the live broadcast.</p>

                <div class="form-wrapper">
                    <div class="input-group">
                        <input type="text" id="code-input" placeholder="e.g. CS-XXXXXXX"
                            autocomplete="off" spellcheck="false">
                        <div class="input-focus-border"></div>
                    </div>
                    <button id="watch-btn">
                        <span>Join Stream</span>
                        <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                            <polyline points="12 5 19 12 12 19"></polyline>
                        </svg>
                    </button>
                </div>
                <p id="error-msg" class="error hidden"></p>
            </div>
        </div>
    </div>
    <script src="/js/app.js"></script>
</body>

</html>
