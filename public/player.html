<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ChatrixStream — Player</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@800;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/video.js@8/dist/video-js.min.css" rel="stylesheet">
</head>

<body>
    <div id="player-app">
        <div id="error-overlay" class="hidden">
            <div class="error-content">
                <h2 id="error-title">Session Expired</h2>
                <p id="error-desc">Your access has expired. Please enter a new invite code.</p>
                <button id="error-btn" onclick="window.location.href='/'">Get New Code</button>
            </div>
        </div>

        <div id="loading-overlay" class="hidden">
            <div class="spinner"></div>
            <p id="loading-text">Connecting to stream...</p>
        </div>

        <div id="tap-to-play-overlay" class="hidden">
            <div class="tap-to-play-content">
                <div class="tap-icon">
                    <svg class="play-svg" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M8 5v14l11-7z" />
                    </svg>
                </div>
                <p>Tap to Play</p>
                <span class="tap-subtext">Start Live Stream</span>
            </div>
        </div>

        <div id="video-container">
            <video id="video-player" class="video-js vjs-default-skin" autoplay muted playsinline
                webkit-playsinline></video>
            <div id="player-watermark" class="watermark-top-left">
                <span class="watermark-text">ChatrixStream | البركان الاخبارية</span>
            </div>
            <button id="unmute-btn" class="hidden" title="Unmute">
                <svg class="unmute-svg" viewBox="0 0 24 24" fill="currentColor">
                    <path
                        d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z" />
                </svg>
            </button>

            <div id="quality-bar">
                <span id="channel-name"></span>
                <div id="quality-buttons"></div>
                <button id="fullscreen-btn" title="Fullscreen">&#x26F6;</button>
            </div>

            <div id="expiry-notice" class="hidden">
                <span id="expiry-text"></span>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/video.js@8/dist/video.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mpegts.js@1.7.3/dist/mpegts.js"></script>
    <script src="/js/player.js"></script>
</body>

</html>
